[project]
name = "global-mcp-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.0.2",
    "mcp[cli]>=1.26.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["product_assistant*"]

[project.scripts]
product-assistant-mcp = "product_assistant.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
